<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Source resolver: on_load and one retry">
<defs>
<linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123A9C"/><stop offset="1" stop-color="#081A4D"/></linearGradient>
<linearGradient id="bars" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5CE1F7"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<marker id="mmain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5CE1F7"/></marker><marker id="msec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E7887"/></marker><marker id="mfail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7B72"/></marker>
</defs>
<rect x="25.0" y="42.0" width="170" height="56" rx="28.0" fill="url(#plate)" stroke="#2F6FD6" stroke-width="1.5"/>
<text x="110" y="66" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#FFFFFF">on_load</text>
<text x="110" y="85" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#C9DBFF">before each open</text>
<rect x="250.0" y="42.0" width="220" height="56" rx="28.0" fill="url(#bars)" stroke="#5CE1F7" stroke-width="1.5"/>
<text x="360" y="66" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#0B2A7A">your resolver</text>
<text x="360" y="85" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#2A4A8F">request.media, extras</text>
<rect x="530.0" y="42.0" width="220" height="56" rx="28.0" fill="url(#plate)" stroke="#2F6FD6" stroke-width="1.5"/>
<text x="640" y="66" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">mpv opens</text>
<text x="640" y="85" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#C9DBFF">the returned URL</text>
<path d="M195,70 L248,70" fill="none" stroke="#5CE1F7" stroke-width="2.2" marker-end="url(#mmain)"/>
<path d="M470,70 L528,70" fill="none" stroke="#5CE1F7" stroke-width="2.2" marker-end="url(#mmain)"/>
<text x="499" y="58" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#9AA4B2">URL or null</text>
<rect x="530.0" y="162.0" width="220" height="56" rx="28.0" fill="#2D1618" stroke="#FF7B72" stroke-width="1.5"/>
<text x="640" y="186" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#FF7B72">on_load_fail</text>
<text x="640" y="205" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#9AA4B2">the open failed</text>
<path d="M640,98 L640,160" fill="none" stroke="#FF7B72" stroke-width="1.7" marker-end="url(#mfail)"/>
<rect x="250.0" y="162.0" width="220" height="56" rx="28.0" fill="url(#bars)" stroke="#5CE1F7" stroke-width="1.5"/>
<text x="360" y="186" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#0B2A7A">your resolver</text>
<text x="360" y="205" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#2A4A8F">request.isRetry is true</text>
<path d="M530,190 L472,190" fill="none" stroke="#6E7887" stroke-width="1.7" marker-end="url(#msec)"/>
<path d="M360,162 L360,100" fill="none" stroke="#5CE1F7" stroke-width="2.2" marker-end="url(#mmain)"/>
<text x="368" y="135" text-anchor="start" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#9AA4B2">new URL: one retry</text>
<rect x="250.0" y="268.0" width="220" height="44" rx="22" fill="#2D1618" stroke="#FF7B72" stroke-width="1.5"/>
<text x="360" y="286" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#FF7B72">error</text>
<text x="360" y="305" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#9AA4B2">same URL or null</text>
<path d="M360,218 L360,266" fill="none" stroke="#FF7B72" stroke-width="1.7" marker-end="url(#mfail)"/>
<rect x="25.0" y="162.0" width="170" height="56" rx="28.0" fill="none" stroke="#6E7887" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="110" y="186" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#E6EDF3">Hook.load</text>
<text x="110" y="205" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#9AA4B2">your hook, if any</text>
<path d="M110,98 L110,160" fill="none" stroke="#6E7887" stroke-width="1.7" stroke-dasharray="5 5" marker-end="url(#msec)"/>
<text x="118" y="135" text-anchor="start" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#9AA4B2">runs after</text>
</svg>
