<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Error, end of file, audio output and log streams">
<defs>
<linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123A9C"/><stop offset="1" stop-color="#081A4D"/></linearGradient>
<linearGradient id="bars" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5CE1F7"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<marker id="mmain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5CE1F7"/></marker><marker id="msec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E7887"/></marker><marker id="mfail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7B72"/></marker>
</defs>
<rect x="340.0" y="30.0" width="220" height="60" rx="30.0" fill="url(#plate)" stroke="#2F6FD6" stroke-width="1.5"/>
<text x="450" y="56" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" fill="#FFFFFF">Player</text>
<text x="450" y="75" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#C9DBFF">events from mpv</text>
<rect x="15.0" y="179.0" width="200" height="72" rx="36.0" fill="url(#plate)" stroke="#2F6FD6" stroke-width="1.5"/>
<text x="115" y="211" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#FFFFFF">stream.error</text>
<text x="115" y="230" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#C9DBFF">EndFileError, LogError</text>
<path d="M450,92 L450,130 L115,130 L115,177" fill="none" stroke="#5CE1F7" stroke-width="2.2" marker-end="url(#mmain)"/>
<rect x="235.0" y="179.0" width="200" height="72" rx="36.0" fill="url(#plate)" stroke="#2F6FD6" stroke-width="1.5"/>
<text x="335" y="211" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#FFFFFF">stream.endFile</text>
<text x="335" y="230" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#C9DBFF">every file end</text>
<path d="M450,92 L450,130 L335,130 L335,177" fill="none" stroke="#5CE1F7" stroke-width="2.2" marker-end="url(#mmain)"/>
<rect x="465.0" y="179.0" width="200" height="72" rx="36.0" fill="url(#plate)" stroke="#2F6FD6" stroke-width="1.5"/>
<text x="565" y="202" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#FFFFFF">audioOutputState</text>
<text x="565" y="221" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#C9DBFF">closed, initializing,</text>
<text x="565" y="237" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#C9DBFF">active, failed</text>
<path d="M450,92 L450,130 L565,130 L565,177" fill="none" stroke="#5CE1F7" stroke-width="2.2" marker-end="url(#mmain)"/>
<rect x="685.0" y="179.0" width="200" height="72" rx="36.0" fill="url(#plate)" stroke="#2F6FD6" stroke-width="1.5"/>
<text x="785" y="211" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#FFFFFF">log, internalLog</text>
<text x="785" y="230" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#C9DBFF">mpv's and the library's</text>
<path d="M450,92 L450,130 L785,130 L785,177" fill="none" stroke="#5CE1F7" stroke-width="2.2" marker-end="url(#mmain)"/>
<path d="M565,253 C565,300 115,300 115,253" fill="none" stroke="#FF7B72" stroke-width="1.7" stroke-dasharray="5 5" marker-end="url(#mfail)"/>
<text x="340" y="326" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#FF7B72">failed also emits a LogError</text>
</svg>
