<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Player lifecycle">
<defs>
<linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123A9C"/><stop offset="1" stop-color="#081A4D"/></linearGradient>
<linearGradient id="bars" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5CE1F7"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<marker id="mmain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5CE1F7"/></marker><marker id="msec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6E7887"/></marker><marker id="mfail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF7B72"/></marker>
</defs>
<rect x="15.0" y="43.0" width="180" height="64" rx="32.0" fill="url(#plate)" stroke="#2F6FD6" stroke-width="1.5"/>
<text x="105" y="71" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#FFFFFF">ensureInitialized()</text>
<text x="105" y="90" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#C9DBFF">once, at app start</text>
<rect x="212.0" y="43.0" width="180" height="64" rx="32.0" fill="url(#plate)" stroke="#2F6FD6" stroke-width="1.5"/>
<text x="302" y="71" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#FFFFFF">Player()</text>
<text x="302" y="90" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#C9DBFF">one per session</text>
<path d="M196,75 L209,75" fill="none" stroke="#5CE1F7" stroke-width="2.2" marker-end="url(#mmain)"/>
<rect x="409.0" y="43.0" width="180" height="64" rx="32.0" fill="url(#bars)" stroke="#5CE1F7" stroke-width="1.5"/>
<text x="499" y="71" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#0B2A7A">open()</text>
<text x="499" y="90" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#2A4A8F">or openAll()</text>
<path d="M393,75 L406,75" fill="none" stroke="#5CE1F7" stroke-width="2.2" marker-end="url(#mmain)"/>
<rect x="606.0" y="43.0" width="180" height="64" rx="32.0" fill="url(#bars)" stroke="#5CE1F7" stroke-width="1.5"/>
<text x="696" y="71" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#0B2A7A">stream and setters</text>
<text x="696" y="90" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#2A4A8F">listen and control</text>
<path d="M590,75 L603,75" fill="none" stroke="#5CE1F7" stroke-width="2.2" marker-end="url(#mmain)"/>
<rect x="803.0" y="43.0" width="180" height="64" rx="32.0" fill="url(#plate)" stroke="#2F6FD6" stroke-width="1.5"/>
<text x="893" y="71" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#FFFFFF">dispose()</text>
<text x="893" y="90" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#C9DBFF">releases libmpv</text>
<path d="M787,75 L800,75" fill="none" stroke="#5CE1F7" stroke-width="2.2" marker-end="url(#mmain)"/>
</svg>
