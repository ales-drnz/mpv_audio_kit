<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="playWhenReady and playing over time">
<defs>
<linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123A9C"/><stop offset="1" stop-color="#081A4D"/></linearGradient>
<linearGradient id="bars" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5CE1F7"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
<marker id="mmain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#123A9C"/></marker><marker id="msec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8C95A3"/></marker><marker id="mfail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"/></marker>
</defs>
<line x1="210" y1="40" x2="210" y2="250" stroke="#8C95A3" stroke-width="1" stroke-dasharray="3 4"/>
<text x="210" y="32" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#1F2328">play()</text>
<line x1="390" y1="40" x2="390" y2="250" stroke="#8C95A3" stroke-width="1" stroke-dasharray="3 4"/>
<text x="390" y="32" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#1F2328">seek()</text>
<line x1="560" y1="40" x2="560" y2="250" stroke="#8C95A3" stroke-width="1" stroke-dasharray="3 4"/>
<text x="560" y="32" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#1F2328">network stall</text>
<line x1="760" y1="40" x2="760" y2="250" stroke="#8C95A3" stroke-width="1" stroke-dasharray="3 4"/>
<text x="760" y="32" text-anchor="middle" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" fill="#1F2328">pause()</text>
<text x="20" y="98" text-anchor="start" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#1F2328">playWhenReady</text>
<path d="M170,110 L170,110 L170,110 L210,110 L210,70 L760,70 L760,110 L870,110" fill="none" stroke="#123A9C" stroke-width="2.6"/>
<text x="165" y="114" text-anchor="end" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#59636E">false</text>
<text x="165" y="74" text-anchor="end" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#59636E">true</text>
<text x="20" y="188" text-anchor="start" font-family="Noto Sans Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#1F2328">playing</text>
<path d="M170,200 L170,200 L170,200 L230,200 L230,160 L390,160 L390,200 L430,200 L430,160 L560,160 L560,200 L650,200 L650,160 L760,160 L760,200 L870,200" fill="none" stroke="#123A9C" stroke-width="2.6"/>
<text x="165" y="204" text-anchor="end" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#59636E">false</text>
<text x="165" y="164" text-anchor="end" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="400" fill="#59636E">true</text>
<text x="410" y="275" text-anchor="middle" font-family="Noto Sans, system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="400" fill="#59636E">playing flips for the seek and the stall; playWhenReady does not</text>
</svg>
