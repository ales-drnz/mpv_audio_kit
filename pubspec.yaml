name: mpv_audio_kit
description: Dart audio player built on mpv v0.41.0. Supports audio filters, equalizer, visualizer, waveform and more. Targets macOS, Windows, Linux, iOS, Android and the web.
version: 0.5.3
homepage: https://github.com/ales-drnz/mpv_audio_kit
repository: https://github.com/ales-drnz/mpv_audio_kit
issue_tracker: https://github.com/ales-drnz/mpv_audio_kit/issues

topics:
  - cross-platform
  - audio-player
  - libmpv
  - ffmpeg
  - dsp

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

screenshots:
  - description: 'The mpv_audio_kit package logo.'
    path: imgs/mpv_audio_kit.png

environment:
  sdk: ^3.10.0
  flutter: '>=3.41.0'

dependencies:
  code_assets: '>=1.1.0 <3.0.0'
  crypto: ^3.0.7
  ffi: ^2.1.3
  fftea: ^1.5.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  hooks: ^2.0.0
  meta: ^1.15.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.25.0

flutter:
  # The web module (libmpv.mjs, libmpv.wasm, mak_webaudio_processor.js),
  # installed in web/ by scripts/update_libmpv.sh and kept out of git. A
  # folder, not the three files: `flutter test` bundles every listed asset,
  # whatever its platforms, and fails on a missing one.
  assets:
    - path: web/
      platforms: [web]
  plugin:
    platforms:
      android:
        package: com.alesdrnz.mpv_audio_kit
        pluginClass: MpvAudioKitPlugin
        ffiPlugin: true
      ios:
        pluginClass: MpvAudioKitPlugin
        ffiPlugin: true
        sharedDarwinSource: true
      linux:
        pluginClass: MpvAudioKitPlugin
        ffiPlugin: true
      macos:
        pluginClass: MpvAudioKitPlugin
        ffiPlugin: true
        sharedDarwinSource: true
      web:
        pluginClass: MpvAudioKitWeb
        fileName: src/web/mpv_audio_kit_web.dart
      windows:
        pluginClass: MpvAudioKitPluginCApi
        ffiPlugin: true