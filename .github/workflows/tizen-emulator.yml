name: Tizen emulator

# Spike: install the Samsung TV emulator of the Tizen SDK on a GitHub runner
# and start it headless with KVM.
on:
  push:
    branches: ['wip/0.7.0-tizen-emu']

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: KVM
        run: ls -la /dev/kvm || echo "no /dev/kvm"
      # As flutter-tizen's own CI installs it (test.yml).
      - name: Install the Tizen SDK CLI
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y libncurses5 python3.8 libpython3.8 gettext \
            libkf5itemmodels5 libkf5kiowidgets5 libkchart2 dbus-x11 gnome-keyring \
            qemu-kvm libvirt-daemon-system bridge-utils libpixman-1-0 libsdl2-2.0-0 xvfb
          curl -fsSL https://download.tizen.org/sdk/Installer/tizen-sdk_10.0/web-cli_Tizen_SDK_10.0_ubuntu-64.bin -o install.bin
          chmod a+x install.bin
          ./install.bin --accept-license "$HOME/tizen-studio"
          rm install.bin
      - name: KVM for the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Install the TV emulator
        run: |
          pm="$HOME/tizen-studio/package-manager/package-manager-cli.bin"
          sudo apt-get install -y libsdl1.2debian openvpn libgl1 libglu1-mesa mesa-utils libxcb-render-util0 libxcb-image0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libv4l-0 > /dev/null
          mkdir -p logs
          "$pm" show-pkgs --tree > logs/show-pkgs-tree.txt 2>&1 || true
          grep -n -B2 -A12 "TV-SAMSUNG-Public-Emulator\|TV Extensions-10.0" logs/show-pkgs-tree.txt | head -60 || true
          "$pm" install --accept-license Emulator 2>&1 | tail -8
          "$pm" install --accept-license TV-SAMSUNG-Public-Emulator 2>&1 | tee logs/install-tv-emulator.txt | tail -40
          "$pm" show-info 2>&1 | tail -30
          ls "$HOME/tizen-studio/tools/emulator/bin" || true
          ls "$HOME/tizen-studio/platforms" "$HOME/tizen-studio/platforms"/* || true
      - name: Create and start a TV emulator
        run: |
          em="$HOME/tizen-studio/tools/emulator/bin/em-cli"
          sdb="$HOME/tizen-studio/tools/sdb"
          "$em" --help > logs/em-help.txt 2>&1 || true
          "$em" list-platform > logs/em-platforms.txt 2>&1 || true
          cat logs/em-help.txt logs/em-platforms.txt
          plat="$(grep -oiE 'tv-samsung[^ ]*' logs/em-platforms.txt | head -1)"
          echo "platform: $plat"
          "$em" create -n tv -p "$plat" > logs/em-create.txt 2>&1 || true
          cat logs/em-create.txt
          "$em" list-vm -d > logs/em-vms.txt 2>&1 || true
          cat logs/em-vms.txt
          # The emulator draws through VIGS, on the host's OpenGL: a virtual
          # display with GLX and Mesa's software renderer.
          export LIBGL_ALWAYS_SOFTWARE=1
          Xvfb :99 -screen 0 1920x1080x24 +extension GLX +render -nolisten tcp > logs/xvfb.txt 2>&1 &
          export DISPLAY=:99
          sleep 3
          glxinfo -B > logs/glxinfo.txt 2>&1 || true
          cat logs/glxinfo.txt | head -20
          "$HOME/tizen-studio/tools/emulator/bin/check-gl" > logs/check-gl.txt 2>&1 || true
          cat logs/check-gl.txt | tail -20
          ("$em" launch -n tv > logs/em-launch.txt 2>&1 &)
          for i in $(seq 90); do
            "$sdb" devices | tee logs/sdb-devices.txt | grep -q emulator && break
            sleep 5
          done
          "$sdb" devices
          "$sdb" capability > logs/sdb-capability.txt 2>&1 || true
          cat logs/sdb-capability.txt logs/em-launch.txt | head -60
          echo "=== vm files"; find "$HOME/tizen-studio-data/emulator/vms/tv" -maxdepth 2 | head -30
          echo "=== logs"; for f in "$HOME"/tizen-studio-data/emulator/vms/tv/logs/*; do echo "--- $f"; tail -60 "$f"; done
          conf="$HOME/tizen-studio-data/emulator/vms/tv/vm_launch.conf"
          echo "=== launch conf"; cat "$conf"
          cp "$conf" logs/vm_launch.conf
          # Without the TV tuner, which only feeds broadcast video.
          echo "=== launch without the tuner"
          grep -v "maru-virtual-tuner" "$conf" > "$conf.notuner" && mv "$conf.notuner" "$conf"
          ("$HOME/tizen-studio/platforms/tizen-10.0/tv-samsung/emulator/bin/emulator.sh" --conf "$conf" -j "$HOME/tizen-studio/jdk/bin/java" > logs/emulator-notuner.txt 2>&1 &)
          for i in $(seq 90); do
            "$sdb" devices | grep -q emulator && break
            sleep 5
          done
          "$sdb" devices
          tail -40 logs/emulator-notuner.txt
          tail -30 "$HOME/tizen-studio-data/emulator/vms/tv/logs/emulator.log"
          "$sdb" shell "cat /etc/tizen-release; uname -a; ls /usr/lib/libcapi-media-audio-io*" 2>&1 | head || true
          cp -r "$HOME/tizen-studio-data/emulator/vms/tv/logs" logs/vm-logs 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tizen-spike-logs
          path: logs/
