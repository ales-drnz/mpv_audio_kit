name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the current stable.
        flutter: ['3.38.x', 'any']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: test_app
      - name: Format
        if: matrix.flutter == 'any'
        run: dart format --output=none --set-exit-if-changed lib test example test_app/lib test_app/integration_test hook tool
      - run: flutter analyze
      - name: Publish dry run
        if: matrix.flutter == 'any'
        run: flutter pub publish --dry-run
      # The generated effects API must be exactly what tool/codegen emits.
      - name: Codegen drift
        if: matrix.flutter == 'any'
        run: tool/codegen/regen.sh && git diff --exit-code -- lib/src/generated test/generated

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # The build hook bundles libmpv for flutter test. ALSA is its one
      # audio library linked at load time; PipeWire and PulseAudio are
      # opened only if present.
      - name: Install libmpv runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2t64
      - name: Keep core dumps
        run: |
          mkdir -p /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%p
      - name: flutter test -x network
        run: |
          ulimit -c unlimited
          flutter test -x network
      - name: Native backtraces of crashed test processes
        if: failure()
        run: |
          ls /tmp/cores/core.* >/dev/null 2>&1 || { echo "no core dumps"; exit 0; }
          sudo apt-get install -y gdb
          tester="$FLUTTER_ROOT/bin/cache/artifacts/engine/linux-x64/flutter_tester"
          for core in /tmp/cores/core.*; do
            echo "::group::$core"
            gdb -batch -ex 'info sharedlibrary' -ex 'thread apply all bt 25' "$tester" "$core" 2>&1 | grep -v '^\[New LWP'
            echo "::endgroup::"
          done

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter test -x network

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-24.04
            # The build hook must have put libmpv in the APK for every ABI.
            command: >-
              flutter build apk --debug &&
              unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep -c 'lib/.*/libmpv_audio_kit.so' | grep -qx 3
          - name: Linux
            os: ubuntu-24.04
            command: flutter build linux --debug
          - name: Windows
            os: windows-latest
            command: flutter build windows --debug
          - name: macOS
            os: macos-latest
            command: flutter build macos --debug
          - name: iOS (SwiftPM)
            os: macos-latest
            command: flutter build ios --simulator --debug
          - name: iOS (CocoaPods)
            os: macos-latest
            swiftpm: 'off'
            command: flutter build ios --simulator --debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.name == 'Android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Disable Swift Package Manager
        if: matrix.swiftpm == 'off'
        run: flutter config --no-enable-swift-package-manager
      - name: Build test app
        working-directory: test_app
        run: ${{ matrix.command }}
