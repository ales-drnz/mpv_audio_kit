name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

# A pull request cancels the run its next push makes stale. Pushes to main
# and the release branches are never cancelled: each pushed commit has a
# group of its own, since a shared group would still replace a run that
# waits in it. Every pushed commit then gets a result, which the changes
# gate reads back for the next one.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # The changes job looks for green runs of a commit and of its parent.
  actions: read

# Until a libmpv release is published, set the repository variable
# LIBMPV_SCRIPTS_RUN to the libmpv-scripts run that built it: the jobs that
# bundle libmpv then take that run's libraries instead of the pinned
# release (see .github/actions/libmpv-from-run). Unset the variable once
# the release is out: the run's artifacts expire after 90 days, and main
# would keep testing them instead of the release.
#
# The tests of a fix in libmpv-rN fail here, instead of skipping, on a
# binary without it when rN is the release the run expects (the run's, or
# the pin without one), and test/packaging/libmpv_release_test fails when
# the tests need a release past it. So the tests of rN go in once
# LIBMPV_SCRIPTS_RUN points at the Build of rN.
#
# Before setting it, check that the secret LIBMPV_SCRIPTS_TOKEN exists and
# has not expired: a fine-grained token with Actions read access on
# ales-drnz/libmpv-scripts only, renewed before the expiry date chosen when
# it was made. The changes job checks the token, the run and the pinned
# release before anything else starts (scripts/ci/preflight.sh).
env:
  LIBMPV_SCRIPTS_RUN: ${{ vars.LIBMPV_SCRIPTS_RUN }}

jobs:
  # Decides whether the tests and the builds have anything to check. They
  # are skipped, not left out, so the required checks still report: for a
  # change to the docs alone (README, CHANGELOG, MIGRATION, imgs, doc,
  # tool/diagrams) on top of a commit that passed, and for a commit that
  # already passed on another branch (the same commit pushed to main and to
  # a release branch runs once). The rules live in
  # scripts/ci/changes_gate.sh.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: scripts/ci/changes_gate.sh
      # The libmpv the jobs will bundle must be there: one error here
      # instead of each job failing on its own, minutes in.
      - name: Preflight
        if: steps.diff.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LIBMPV_SCRIPTS_TOKEN: ${{ secrets.LIBMPV_SCRIPTS_TOKEN }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: scripts/ci/preflight.sh

  analyze:
    name: Analyze (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the current stable.
        flutter: ['3.38.x', 'any']
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: test_app
      - name: Format
        if: matrix.flutter == 'any'
        run: dart format --output=none --set-exit-if-changed lib test example test_app/lib test_app/integration_test hook tool
      - run: flutter analyze
      - name: Publish dry run
        if: matrix.flutter == 'any'
        run: flutter pub publish --dry-run
      # The generated effects API must be exactly what tool/codegen emits.
      # git status, not git diff: a file the generator adds is untracked.
      - name: Codegen drift
        if: matrix.flutter == 'any'
        run: |
          tool/codegen/regen.sh
          drift=$(git status --porcelain -- lib/src/generated test/generated)
          if [[ -n "$drift" ]]; then
            echo "::error::The generated files differ from what tool/codegen emits:"
            echo "$drift"
            git diff -- lib/src/generated test/generated | head -200
            exit 1
          fi
      # The scripts of the changes job, against a fake gh (test/ci).
      - name: CI script tests
        if: matrix.flutter == 'any'
        run: for t in test/ci/*_test.sh; do bash "$t"; done

  test-linux:
    name: Test (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ./.github/actions/libmpv-from-run
        with:
          run-id: ${{ env.LIBMPV_SCRIPTS_RUN }}
          token: ${{ secrets.LIBMPV_SCRIPTS_TOKEN }}
          pubspecs: pubspec.yaml
      # The build hook bundles libmpv for flutter test. ALSA is its one
      # audio library linked at load time; PipeWire and PulseAudio are
      # opened only if present.
      - name: Install libmpv runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2t64 pulseaudio pulseaudio-utils
      # The runner has no audio device, so every output fell back to
      # ao=null and the tests that need a real one (the lowLatency start,
      # the system mixer) skipped. A PulseAudio server with a null sink is
      # a real output that plays into nothing. norewinds caps the sink's
      # latency at 50 ms: its default 2 s block hides the output buffer
      # that lowLatency cuts.
      - name: PulseAudio null sink
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null norewinds=1
          pactl set-default-sink ci_null
          pactl info | grep -E '^(Server Name|Default Sink)'
          pactl list sinks | grep -E '^\s*(Name|Latency):'
      - name: Keep core dumps
        run: |
          mkdir -p /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%p
      - name: flutter test -x network
        run: |
          ulimit -c unlimited
          flutter test -x network
      - name: Native backtraces of crashed test processes
        if: failure()
        run: |
          ls /tmp/cores/core.* >/dev/null 2>&1 || { echo "no core dumps"; exit 0; }
          sudo apt-get install -y gdb
          tester="$FLUTTER_ROOT/bin/cache/artifacts/engine/linux-x64/flutter_tester"
          for core in /tmp/cores/core.*; do
            echo "::group::$core"
            gdb -batch -ex 'info sharedlibrary' -ex 'thread apply all bt 25' "$tester" "$core" 2>&1 | grep -v '^\[New LWP'
            echo "::endgroup::"
          done

  test-macos:
    name: Test (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The macOS and Windows images are pinned, so a new Xcode or Visual
    # Studio arrives with a commit that moves the label, not on its own.
    # The toolchain each job got is printed, since an image can still
    # update within its label.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # No Flutter cache off Linux: the macOS and Windows entries weigh 1.5
      # to 2 GB each and pushed the NDK and Gradle caches out of the 10 GB
      # the repository gets.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Toolchain versions
        continue-on-error: true
        run: |
          flutter --version
          xcodebuild -version
          swiftc --version
      - uses: ./.github/actions/libmpv-from-run
        with:
          run-id: ${{ env.LIBMPV_SCRIPTS_RUN }}
          token: ${{ secrets.LIBMPV_SCRIPTS_TOKEN }}
          pubspecs: pubspec.yaml
      - run: flutter test -x network

  build:
    name: Build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-24.04
            # The build hook must have put libmpv in the APK for every ABI,
            # with relocations the plugin's minSdk can load.
            command: >-
              flutter build apk --debug &&
              unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep -c 'lib/.*/libmpv_audio_kit.so' | grep -qx 3 &&
              unzip -q -o build/app/outputs/flutter-apk/app-debug.apk 'lib/*/libmpv_audio_kit.so' -d build/apk_libmpv &&
              ../scripts/check_android_relocs.sh build/apk_libmpv
          - name: Linux
            os: ubuntu-24.04
            command: flutter build linux --debug
          - name: Windows
            os: windows-2025-vs2026
            command: flutter build windows --debug
          # Then the darwin media session suite, which links the plugin's
          # Swift against the FlutterMacOS.framework this build leaves in
          # Build/Products/Debug (test/media_session/darwin/run.sh).
          - name: macOS (SwiftPM)
            os: macos-26
            command: >-
              flutter build macos --debug &&
              ../scripts/ci/check_apple_frameworks.sh build/macos/Build/Products/Debug/mpv_audio_kit_test_app.app/Contents/Frameworks &&
              bash ../test/media_session/darwin/run.sh
          # CocoaPods builds the plugin as mpv_audio_kit.framework: libmpv
          # must land beside it, not over it.
          - name: macOS (CocoaPods)
            os: macos-26
            swiftpm: 'off'
            command: >-
              flutter build macos --debug &&
              ../scripts/ci/check_apple_frameworks.sh --expect-plugin build/macos/Build/Products/Debug/mpv_audio_kit_test_app.app/Contents/Frameworks
          # A device build too, unsigned: the hook takes the xcframework's
          # ios-arm64 slice there, which no simulator build touches.
          - name: iOS (SwiftPM)
            os: macos-26
            command: >-
              flutter build ios --simulator --debug &&
              ../scripts/ci/check_apple_frameworks.sh build/ios/iphonesimulator/Runner.app/Frameworks &&
              flutter build ios --debug --no-codesign &&
              ../scripts/ci/check_apple_frameworks.sh build/ios/iphoneos/Runner.app/Frameworks
          - name: iOS (CocoaPods)
            os: macos-26
            swiftpm: 'off'
            command: >-
              flutter build ios --simulator --debug &&
              ../scripts/ci/check_apple_frameworks.sh --expect-plugin build/ios/iphonesimulator/Runner.app/Frameworks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.name == 'Android'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            test_app/android/*.gradle*
            test_app/android/app/*.gradle*
            test_app/android/gradle/wrapper/gradle-wrapper.properties
            android/*.gradle*
      # Flutter is cached on Linux only, as in Test (macOS).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: ${{ runner.os == 'Linux' }}
      - name: Toolchain versions
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          flutter --version
          xcodebuild -version
          echo "SDKs: macOS $(xcrun --sdk macosx --show-sdk-version), iOS $(xcrun --sdk iphoneos --show-sdk-version)"
          swiftc --version
      - name: Toolchain versions
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          flutter --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          "Visual Studio $(& $vswhere -latest -property catalog_productDisplayVersion) at $vs"
          "MSVC $(Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt")"
      # Gradle installs the NDK of the Flutter release and CMake on every
      # run otherwise: the runner image has neither version. They come from
      # the cache or, before Gradle, from sdkmanager with retries, since a
      # download cut halfway fails the whole build. The cache is saved as
      # soon as they are in, so a build that fails later keeps it. Without
      # a version (Flutter moved it), Gradle installs them as before.
      - name: NDK version
        id: ndk
        if: matrix.name == 'Android'
        run: |
          ndk=$(grep -oP 'val ndkVersion: String = "\K[^"]+' \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" || true)
          if [[ -z "$ndk" ]]; then
            echo "::warning::No ndkVersion in FlutterExtension.kt: Gradle installs the NDK, uncached."
          fi
          echo "version=$ndk" >> "$GITHUB_OUTPUT"
          # The runner's own variable, which the env context does not carry.
          echo "sdk=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_OUTPUT"
      - id: ndk-cache
        if: matrix.name == 'Android' && steps.ndk.outputs.version != ''
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.ndk.outputs.sdk }}/ndk/${{ steps.ndk.outputs.version }}
            ${{ steps.ndk.outputs.sdk }}/cmake/3.22.1
          key: android-ndk-${{ steps.ndk.outputs.version }}-cmake-3.22.1
      - name: Install the NDK and CMake
        if: matrix.name == 'Android' && steps.ndk.outputs.version != '' && steps.ndk-cache.outputs.cache-hit != 'true'
        env:
          SDK: ${{ steps.ndk.outputs.sdk }}
          NDK: ${{ steps.ndk.outputs.version }}
        run: |
          for attempt in 1 2 3; do
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK" "cmake;3.22.1" && exit 0
            echo "::warning::sdkmanager failed, attempt $attempt of 3."
            sleep 20
          done
          exit 1
      - if: matrix.name == 'Android' && steps.ndk.outputs.version != '' && steps.ndk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.ndk.outputs.sdk }}/ndk/${{ steps.ndk.outputs.version }}
            ${{ steps.ndk.outputs.sdk }}/cmake/3.22.1
          key: android-ndk-${{ steps.ndk.outputs.version }}-cmake-3.22.1
      # xvfb, a session bus and gdbus for the media session tests below, and
      # ALSA, the one audio library libmpv links at load time.
      - name: Install Linux build dependencies
        if: matrix.name == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
          xvfb dbus dbus-session-bus-common libglib2.0-bin libasound2t64
      - name: Disable Swift Package Manager
        if: matrix.swiftpm == 'off'
        run: flutter config --no-enable-swift-package-manager
      - uses: ./.github/actions/libmpv-from-run
        with:
          run-id: ${{ env.LIBMPV_SCRIPTS_RUN }}
          token: ${{ secrets.LIBMPV_SCRIPTS_TOKEN }}
          pubspecs: test_app/pubspec.yaml
      - name: Build test app
        working-directory: test_app
        run: ${{ matrix.command }}
      # The media session through the running app, on a session bus of its
      # own and an X server: media_session_test reads the plugin's probe,
      # linux_mpris_test reads the bus with gdbus and sends the commands of
      # a desktop shell.
      - name: Media session integration tests
        if: matrix.name == 'Linux'
        timeout-minutes: 20
        working-directory: test_app
        run: >-
          xvfb-run -a dbus-run-session --
          flutter test -d linux -r expanded
          integration_test/media_session_test.dart
          integration_test/linux_mpris_test.dart
      # media_session_test reads the plugin's probe, windows_smtc_test what
      # the SystemMediaTransportControls themselves hold.
      - name: Media session integration tests
        if: matrix.name == 'Windows'
        timeout-minutes: 20
        working-directory: test_app
        run: >-
          flutter test -d windows -r expanded
          integration_test/media_session_test.dart
          integration_test/windows_smtc_test.dart
      # Spike: whether this runner shows the session to the API the Windows
      # media flyout reads (GlobalSystemMediaTransportControlsSessionManager).
      # It does not gate the build: its log answers the question, then it
      # either joins the step above or goes.
      - name: Media session spike (GSMTC)
        if: matrix.name == 'Windows'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: test_app
        run: flutter test -d windows -r expanded integration_test/windows_gsmtc_spike_test.dart
      # The plugin's JVM tests (android/src/test), through the test app's
      # Gradle build, whose wrapper flutter build apk has just written.
      - name: Kotlin unit tests
        if: matrix.name == 'Android'
        working-directory: test_app/android
        run: ./gradlew :mpv_audio_kit:testDebugUnitTest
