name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The changes job looks for green runs of a commit and of its parent.
  actions: read

# Until a libmpv release is published, set the repository variable
# LIBMPV_SCRIPTS_RUN to the libmpv-scripts run that built it: the jobs that
# bundle libmpv then take that run's libraries instead of the pinned
# release (see .github/actions/libmpv-from-run). It needs the secret
# LIBMPV_SCRIPTS_TOKEN, a token with Actions read access on libmpv-scripts.
# Unset the variable once the release is out: the run's artifacts expire
# after 90 days, and main would keep testing them instead of the release.
env:
  LIBMPV_SCRIPTS_RUN: ${{ vars.LIBMPV_SCRIPTS_RUN }}

jobs:
  # Decides whether the tests and the builds have anything to check. They
  # are skipped, not left out, so the required checks still report: for a
  # change to the docs alone (README, CHANGELOG, MIGRATION, imgs, doc,
  # tool/diagrams) on top of a commit that passed, and for a commit that
  # already passed on another branch (the same commit pushed to main and to
  # a release branch runs once). The rules live in
  # scripts/ci/changes_gate.sh.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: scripts/ci/changes_gate.sh

  analyze:
    name: Analyze (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the current stable.
        flutter: ['3.38.x', 'any']
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter pub get
      - run: flutter pub get
        working-directory: test_app
      - name: Format
        if: matrix.flutter == 'any'
        run: dart format --output=none --set-exit-if-changed lib test example test_app/lib test_app/integration_test hook tool
      - run: flutter analyze
      - name: Publish dry run
        if: matrix.flutter == 'any'
        run: flutter pub publish --dry-run
      # The generated effects API must be exactly what tool/codegen emits.
      # git status, not git diff: a file the generator adds is untracked.
      - name: Codegen drift
        if: matrix.flutter == 'any'
        run: |
          tool/codegen/regen.sh
          drift=$(git status --porcelain -- lib/src/generated test/generated)
          if [[ -n "$drift" ]]; then
            echo "::error::The generated files differ from what tool/codegen emits:"
            echo "$drift"
            git diff -- lib/src/generated test/generated | head -200
            exit 1
          fi
      # The scripts of the changes job, against a fake gh (test/ci).
      - name: CI script tests
        if: matrix.flutter == 'any'
        run: for t in test/ci/*_test.sh; do bash "$t"; done

  test-linux:
    name: Test (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ./.github/actions/libmpv-from-run
        with:
          run-id: ${{ env.LIBMPV_SCRIPTS_RUN }}
          token: ${{ secrets.LIBMPV_SCRIPTS_TOKEN }}
          pubspecs: pubspec.yaml
      # The build hook bundles libmpv for flutter test. ALSA is its one
      # audio library linked at load time; PipeWire and PulseAudio are
      # opened only if present.
      - name: Install libmpv runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2t64
      - name: Keep core dumps
        run: |
          mkdir -p /tmp/cores
          sudo sysctl -w kernel.core_pattern=/tmp/cores/core.%p
      - name: flutter test -x network
        run: |
          ulimit -c unlimited
          flutter test -x network
      - name: Native backtraces of crashed test processes
        if: failure()
        run: |
          ls /tmp/cores/core.* >/dev/null 2>&1 || { echo "no core dumps"; exit 0; }
          sudo apt-get install -y gdb
          tester="$FLUTTER_ROOT/bin/cache/artifacts/engine/linux-x64/flutter_tester"
          for core in /tmp/cores/core.*; do
            echo "::group::$core"
            gdb -batch -ex 'info sharedlibrary' -ex 'thread apply all bt 25' "$tester" "$core" 2>&1 | grep -v '^\[New LWP'
            echo "::endgroup::"
          done

  test-macos:
    name: Test (macOS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: ./.github/actions/libmpv-from-run
        with:
          run-id: ${{ env.LIBMPV_SCRIPTS_RUN }}
          token: ${{ secrets.LIBMPV_SCRIPTS_TOKEN }}
          pubspecs: pubspec.yaml
      - run: flutter test -x network

  build:
    name: Build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-24.04
            # The build hook must have put libmpv in the APK for every ABI,
            # with relocations the plugin's minSdk can load.
            command: >-
              flutter build apk --debug &&
              unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep -c 'lib/.*/libmpv_audio_kit.so' | grep -qx 3 &&
              unzip -q -o build/app/outputs/flutter-apk/app-debug.apk 'lib/*/libmpv_audio_kit.so' -d build/apk_libmpv &&
              ../scripts/check_android_relocs.sh build/apk_libmpv
          - name: Linux
            os: ubuntu-24.04
            command: flutter build linux --debug
          - name: Windows
            os: windows-latest
            command: flutter build windows --debug
          - name: macOS (SwiftPM)
            os: macos-latest
            command: >-
              flutter build macos --debug &&
              ../scripts/ci/check_apple_frameworks.sh build/macos/Build/Products/Debug/mpv_audio_kit_test_app.app/Contents/Frameworks
          # CocoaPods builds the plugin as mpv_audio_kit.framework: libmpv
          # must land beside it, not over it.
          - name: macOS (CocoaPods)
            os: macos-latest
            swiftpm: 'off'
            command: >-
              flutter build macos --debug &&
              ../scripts/ci/check_apple_frameworks.sh --expect-plugin build/macos/Build/Products/Debug/mpv_audio_kit_test_app.app/Contents/Frameworks
          - name: iOS (SwiftPM)
            os: macos-latest
            command: >-
              flutter build ios --simulator --debug &&
              ../scripts/ci/check_apple_frameworks.sh build/ios/iphonesimulator/Runner.app/Frameworks
          - name: iOS (CocoaPods)
            os: macos-latest
            swiftpm: 'off'
            command: >-
              flutter build ios --simulator --debug &&
              ../scripts/ci/check_apple_frameworks.sh --expect-plugin build/ios/iphonesimulator/Runner.app/Frameworks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        if: matrix.name == 'Android'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            test_app/android/*.gradle*
            test_app/android/app/*.gradle*
            test_app/android/gradle/wrapper/gradle-wrapper.properties
            android/*.gradle*
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Gradle installs the NDK of the Flutter release and CMake on every
      # run otherwise: the runner image has neither version.
      - name: NDK version
        id: ndk
        if: matrix.name == 'Android'
        run: |
          ndk=$(grep -oP 'val ndkVersion: String = "\K[^"]+' \
            "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")
          echo "version=$ndk" >> "$GITHUB_OUTPUT"
          # The runner's own variable, which the env context does not carry.
          echo "sdk=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: matrix.name == 'Android' && steps.ndk.outputs.version != ''
        with:
          path: |
            ${{ steps.ndk.outputs.sdk }}/ndk/${{ steps.ndk.outputs.version }}
            ${{ steps.ndk.outputs.sdk }}/cmake/3.22.1
          key: android-ndk-${{ steps.ndk.outputs.version }}-cmake-3.22.1
      - name: Install Linux build dependencies
        if: matrix.name == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Disable Swift Package Manager
        if: matrix.swiftpm == 'off'
        run: flutter config --no-enable-swift-package-manager
      - uses: ./.github/actions/libmpv-from-run
        with:
          run-id: ${{ env.LIBMPV_SCRIPTS_RUN }}
          token: ${{ secrets.LIBMPV_SCRIPTS_TOKEN }}
          pubspecs: test_app/pubspec.yaml
      - name: Build test app
        working-directory: test_app
        run: ${{ matrix.command }}
