name: libmpv from a libmpv-scripts run
description: >-
  Bundles the libraries of a libmpv-scripts CI run instead of the pinned
  release, through the build hook's libmpv user define, and sets
  MAK_LIBMPV_RELEASE to the run's release, the one the release-gated tests
  then expect. For testing a libmpv build before its release exists. Does
  nothing without a run id.
inputs:
  run-id:
    description: The libmpv-scripts workflow run whose libmpv-release artifact to use.
    required: false
    default: ''
  token:
    description: >-
      A token with Actions read access on libmpv-scripts. The workflow's
      own GITHUB_TOKEN cannot read another repository's artifacts.
    required: false
    default: ''
  pubspecs:
    description: The pubspec.yaml files to point at it, separated by spaces.
    required: true
runs:
  using: composite
  steps:
    - id: check
      if: inputs.run-id != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RUN_ID: ${{ inputs.run-id }}
        FORK: ${{ github.event.pull_request.head.repo.fork }}
      run: |
        if [[ -z "$GH_TOKEN" ]]; then
          if [[ "$FORK" == true ]]; then
            # A pull request from a fork gets no secrets: it builds against
            # the pinned release instead.
            echo "::warning::No LIBMPV_SCRIPTS_TOKEN on a fork pull request: using the pinned libmpv release."
            echo "use=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::LIBMPV_SCRIPTS_RUN is set but LIBMPV_SCRIPTS_TOKEN is not: add a token with Actions read access on ales-drnz/libmpv-scripts."
          exit 1
        fi
        # Say which build is under test, and refuse one that did not pass.
        read -r sha branch conclusion < <(gh api \
          "repos/ales-drnz/libmpv-scripts/actions/runs/$RUN_ID" \
          --jq '"\(.head_sha) \(.head_branch) \(.conclusion)"')
        echo "libmpv-scripts run $RUN_ID: $branch at $sha, $conclusion"
        if [[ "$conclusion" != success ]]; then
          echo "::error::libmpv-scripts run $RUN_ID did not succeed ($conclusion)."
          exit 1
        fi
        echo "use=true" >> "$GITHUB_OUTPUT"
    - if: steps.check.outputs.use == 'true'
      uses: actions/download-artifact@v8
      with:
        name: libmpv-release
        repository: ales-drnz/libmpv-scripts
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.token }}
        path: ${{ runner.temp }}/libmpv
    - if: steps.check.outputs.use == 'true'
      shell: bash
      run: |
        manifest="$RUNNER_TEMP/libmpv/manifest.json"
        # The tests of a release expect the run's (expectedLibmpvRelease in
        # test/_helpers/setter_test_helpers.dart): on CI one the binary
        # lacks fails instead of skipping. jq.exe on Windows ends its lines
        # with CRLF.
        release=$(jq -r .release "$manifest" | tr -d '\r')
        echo "Manifest of the run: $(jq -c '{release, source}' "$manifest" | tr -d '\r')"
        echo "MAK_LIBMPV_RELEASE=$release" >> "$GITHUB_ENV"
        # The user define skips the hook's checksums, so a table that does
        # not match these binaries would stay green until the release. The
        # web module is pinned by the manifest copy of tool/codegen, which
        # scripts/update_libmpv.sh writes with the hook.
        web=$(jq -r '.web.asset // empty' "$manifest" | tr -d '\r')
        jq -r '.assets | to_entries[] | "\(.key) \(.value)"' \
          "$manifest" |
          while read -r asset sha; do
            # jq.exe on Windows ends its lines with CRLF.
            sha="${sha%$'\r'}"
            pinned=hook/build.dart
            [[ "$asset" == "$web" ]] && pinned=tool/codegen/libmpv_manifest.json
            grep -q "$sha" "$GITHUB_WORKSPACE/$pinned" ||
              echo "::warning::$asset of this run is not the one pinned in $pinned; run scripts/update_libmpv.sh before the release."
          done
        for pubspec in ${{ inputs.pubspecs }}; do
          if grep -q '^hooks:' "$pubspec"; then
            echo "::error::$pubspec already has a hooks section."
            exit 1
          fi
          printf '\nhooks:\n  user_defines:\n    mpv_audio_kit:\n      libmpv: %s\n' \
            "$RUNNER_TEMP/libmpv" >> "$pubspec"
        done
