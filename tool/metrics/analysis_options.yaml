# The rules of the Dart packages under tool/ (metrics, data_classes,
# mutation): the ones of the package itself that make sense off Flutter,
# without the API docs. data_classes and mutation include this file.

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
    strict-inference: true

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_final_in_for_each
    - unawaited_futures
    - directives_ordering
    - sort_pub_dependencies
    - prefer_single_quotes
    - use_super_parameters
    - avoid_redundant_argument_values
    - unnecessary_parenthesis
    - avoid_dynamic_calls
    - unnecessary_async
    - cancel_subscriptions
    - close_sinks
    - discarded_futures
    - unnecessary_ignore
